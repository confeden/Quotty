[package]
name = "quotty"
version = "1.4.3"
edition = "2021"
description = "Quotty - a movable strip showing the quota and reset timers of the AI tool you are using"

[[bin]]
name = "quotty"
path = "src/main.rs"

[dependencies]
# GUI — glow only (no wgpu backend, keeps the binary + memory small)
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"

# Tray
tray-icon = "0.19"

# HTTP + JSON
ureq = { version = "2.10", features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Direct rustls access, only to talk to Antigravity's local language server,
# which serves HTTPS with a self-signed certificate on 127.0.0.1.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# Crypto for reading Claude Desktop's local token cache
base64 = "0.22"
aes-gcm = "0.10"

# Time
chrono = { version = "0.4", features = ["clock"] }

# Shortcuts (.lnk) for desktop + autostart
mslnk = "0.1"
dirs = "5"

# Native window handle, to keep the strip above the taskbar
raw-window-handle = "0.6"

[build-dependencies]
embed-resource = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_NetworkManagement_IpHelper",
    "Wdk_System_Threading",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
